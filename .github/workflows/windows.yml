name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mise and locked Plum compiler
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.18
          install_args: --locked github:bradcypert/plum

      - name: Install Windows native build dependencies
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-binutils

      - name: Record toolchain versions
        run: |
          mise which plum
          mise exec -- plum --version
          clang --version
          python3 --version
          pkg-config --modversion raylib
          pacman -Q > build-packages.txt

      - name: Test packaging dependency resolution
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Plum source
        run: mise run check

      - name: Run Plum and process integration tests
        run: mise run test

      - name: Build Windows application
        run: mise run build

      - name: Bundle executable and runtime dependencies
        run: python3 scripts/package_windows.py

      - name: Smoke-test the packaged application
        run: python3 scripts/smoke_windows.py

      - name: Upload Windows download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerlaunch-windows-x64
          path: build/package/powerlaunch-windows-x64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-diagnostics
          path: |
            build-packages.txt
            build/windows-smoke.log
            build/windows-smoke.png
          if-no-files-found: ignore
          retention-days: 14
